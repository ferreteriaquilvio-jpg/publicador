name: Crear instalador de Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests pyinstaller
      - run: python -m PyInstaller --onefile --windowed --name Publicador publicar.py
      - run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y }
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" instalador.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: Publicador-Windows
          path: |
            Publicador-Setup.exe
            dist/Publicador.exe
